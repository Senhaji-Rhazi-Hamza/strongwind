apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  json-api.yaml: |
    apiVersion: 1
    datasources:
      - name: JSON API
        type: marcusolsson-json-datasource
        access: proxy
        url: http://gpu-observability-api:8000
        isDefault: false
        uid: gpu-obs-json-api
        orgId: 1
        version: 1
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: gpu-observability-provider
        orgId: 1
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  gpu-observability.json: |
    {
      "title": "GPU Observability",
      "uid": "gpu-observability",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "GPU Hours per Researcher",
          "type": "barchart",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 10 },
          "datasource": { "type": "marcusolsson-json-datasource", "uid": "gpu-obs-json-api" },
          "targets": [
            {
              "refId": "A",
              "urlPath": "/summary",
              "method": "GET",
              "fields": [
                { "name": "researcher", "jsonPath": "$[*].researcher", "type": "string" },
                { "name": "total_gpu_hours", "jsonPath": "$[*].total_gpu_hours", "type": "number" }
              ]
            }
          ],
          "options": {
            "orientation": "vertical",
            "xField": "researcher",
            "colorByField": "researcher",
            "showValue": "always"
          }
        },
        {
          "id": 2,
          "title": "Failed Runs per Researcher",
          "type": "barchart",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 10 },
          "datasource": { "type": "marcusolsson-json-datasource", "uid": "gpu-obs-json-api" },
          "targets": [
            {
              "refId": "A",
              "urlPath": "/summary",
              "method": "GET",
              "fields": [
                { "name": "researcher", "jsonPath": "$[*].researcher", "type": "string" },
                { "name": "failed_runs", "jsonPath": "$[*].failed_runs", "type": "number" }
              ]
            }
          ],
          "options": {
            "orientation": "vertical",
            "xField": "researcher",
            "showValue": "always"
          }
        },
        {
          "id": 3,
          "title": "GPU Hours per Model",
          "type": "piechart",
          "gridPos": { "x": 0, "y": 10, "w": 8, "h": 8 },
          "datasource": { "type": "marcusolsson-json-datasource", "uid": "gpu-obs-json-api" },
          "targets": [
            {
              "refId": "A",
              "urlPath": "/by-model",
              "method": "GET",
              "fields": [
                { "name": "model", "jsonPath": "$[*].model", "type": "string" },
                { "name": "total_gpu_hours", "jsonPath": "$[*].total_gpu_hours", "type": "number" }
              ]
            }
          ],
          "options": {
            "pieType": "pie",
            "displayLabels": ["percent"],
            "legend": { "showLegend": true, "placement": "bottom" }
          },
          "transformations": [
            {
              "id": "partitionByValues",
              "options": {
                "fields": ["model"]
              }
            }
          ]
        },
        {
          "id": 4,
          "title": "Daily GPU Consumption Trend",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 10, "w": 16, "h": 8 },
          "datasource": { "type": "marcusolsson-json-datasource", "uid": "gpu-obs-json-api" },
          "targets": [
            {
              "refId": "A",
              "urlPath": "/trend",
              "method": "GET",
              "fields": [
                { "name": "date", "jsonPath": "$[*].date", "type": "time" },
                { "name": "total_gpu_hours", "jsonPath": "$[*].total_gpu_hours", "type": "number" }
              ]
            }
          ],
          "options": {
            "tooltip": { "mode": "single" }
          }
        },
        {
          "id": 5,
          "title": "Wasted GPU Runs (utilization < 50%)",
          "type": "table",
          "gridPos": { "x": 0, "y": 18, "w": 24, "h": 8 },
          "datasource": { "type": "marcusolsson-json-datasource", "uid": "gpu-obs-json-api" },
          "targets": [
            {
              "refId": "A",
              "urlPath": "/waste",
              "method": "GET",
              "fields": [
                { "name": "researcher", "jsonPath": "$[*].researcher", "type": "string" },
                { "name": "model", "jsonPath": "$[*].model", "type": "string" },
                { "name": "experiment_type", "jsonPath": "$[*].experiment_type", "type": "string" },
                { "name": "gpu_count", "jsonPath": "$[*].gpu_count", "type": "number" },
                { "name": "gpu_utilization_pct", "jsonPath": "$[*].gpu_utilization_pct", "type": "number" },
                { "name": "gpu_hours", "jsonPath": "$[*].gpu_hours", "type": "number" }
              ]
            }
          ],
          "fieldConfig": {
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "gpu_utilization_pct" },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "red", "value": 0 },
                        { "color": "orange", "value": 30 },
                        { "color": "green", "value": 50 }
                      ]
                    }
                  },
                  { "id": "custom.displayMode", "value": "color-background" }
                ]
              }
            ]
          },
          "options": {
            "sortBy": [{ "displayName": "gpu_hours", "desc": true }]
          }
        },
        {
          "id": 6,
          "title": "Failure Rate per Researcher",
          "type": "barchart",
          "gridPos": { "x": 0, "y": 26, "w": 12, "h": 10 },
          "datasource": { "type": "marcusolsson-json-datasource", "uid": "gpu-obs-json-api" },
          "targets": [
            {
              "refId": "A",
              "urlPath": "/failure-rate",
              "method": "GET",
              "fields": [
                { "name": "researcher", "jsonPath": "$[*].researcher", "type": "string" },
                { "name": "failure_rate_pct", "jsonPath": "$[*].failure_rate_pct", "type": "number" },
                { "name": "wasted_gpu_hours", "jsonPath": "$[*].wasted_gpu_hours", "type": "number" }
              ]
            }
          ],
          "fieldConfig": {
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "failure_rate_pct" },
                "properties": [
                  { "id": "unit", "value": "percent" },
                  { "id": "min", "value": 0 },
                  { "id": "max", "value": 100 },
                  { "id": "custom.axisPlacement", "value": "right" },
                  { "id": "custom.axisLabel", "value": "Failure Rate (%)" },
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "wasted_gpu_hours" },
                "properties": [
                  { "id": "custom.axisPlacement", "value": "left" },
                  { "id": "custom.axisLabel", "value": "Wasted GPU Hours" },
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } }
                ]
              }
            ]
          },
          "options": {
            "orientation": "vertical",
            "xField": "researcher",
            "legend": { "displayMode": "list", "placement": "bottom" },
            "showValue": "always"
          }
        },
        {
          "id": 7,
          "title": "GPU Efficiency by Experiment Type",
          "type": "barchart",
          "gridPos": { "x": 12, "y": 26, "w": 12, "h": 10 },
          "datasource": { "type": "marcusolsson-json-datasource", "uid": "gpu-obs-json-api" },
          "targets": [
            {
              "refId": "A",
              "urlPath": "/by-experiment",
              "method": "GET",
              "fields": [
                { "name": "experiment_type", "jsonPath": "$[*].experiment_type", "type": "string" },
                { "name": "avg_utilization", "jsonPath": "$[*].avg_utilization", "type": "number" },
                { "name": "wasted_gpu_hours", "jsonPath": "$[*].wasted_gpu_hours", "type": "number" }
              ]
            }
          ],
          "fieldConfig": {
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "avg_utilization" },
                "properties": [
                  { "id": "unit", "value": "percent" },
                  { "id": "min", "value": 0 },
                  { "id": "max", "value": 100 },
                  { "id": "custom.axisPlacement", "value": "right" },
                  { "id": "custom.axisLabel", "value": "Avg Utilization (%)" },
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "wasted_gpu_hours" },
                "properties": [
                  { "id": "custom.axisPlacement", "value": "left" },
                  { "id": "custom.axisLabel", "value": "Wasted GPU Hours" },
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } }
                ]
              }
            ]
          },
          "options": {
            "orientation": "vertical",
            "xField": "experiment_type",
            "legend": { "displayMode": "list", "placement": "bottom" },
            "showValue": "always"
          }
        }
      ]
    }
